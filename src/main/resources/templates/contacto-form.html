<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h1 class="text-center mb-4"
                th:text="${accion == '/contactos'} ? 'Añadir contacto' : 'Editar contacto'">
                Añadir contacto
            </h1>

            <form th:action="${accion}"
                  th:object="${contacto}"
                  method="post">

                <!-- Nombre -->
                <div class="mb-3">

                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           class="form-control">

                    <p th:if="${#fields.hasErrors('nombre')}"
                       th:text="${#fields.errors('nombre')[0]}"
                       class="text-danger mt-1">
                    </p>

                </div>


                <!-- Apellidos -->
                <div class="mb-3">

                    <label for="apellidos" class="form-label">
                        Apellidos
                    </label>

                    <input type="text"
                           id="apellidos"
                           th:field="*{apellidos}"
                           class="form-control">

                    <p th:if="${#fields.hasErrors('apellidos')}"
                       th:text="${#fields.errors('apellidos')[0]}"
                       class="text-danger mt-1">
                    </p>

                </div>


                <!-- Teléfono -->
                <div class="mb-3">

                    <label for="telefono" class="form-label">
                        Teléfono
                    </label>

                    <input type="text"
                           id="telefono"
                           th:field="*{telefono}"
                           class="form-control"
                           placeholder="+34123456789">

                    <p th:if="${#fields.hasErrors('telefono')}"
                       th:text="${#fields.errors('telefono')[0]}"
                       class="text-danger mt-1">
                    </p>

                </div>


                <!-- Email -->
                <div class="mb-4">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="form-control">

                    <p th:if="${#fields.hasErrors('email')}"
                       th:text="${#fields.errors('email')[0]}"
                       class="text-danger mt-1">
                    </p>

                </div>


                <div class="d-flex justify-content-between">

                    <a th:href="@{/contactos}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        Guardar
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
