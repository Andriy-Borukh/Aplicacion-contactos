<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mis contactos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Mis contactos</h1>

        <a th:href="@{/contactos/nuevo}" class="btn btn-primary">
            Añadir contacto
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">

                    <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="contacto : ${contactos}">

                        <td th:text="${contacto.nombre}"></td>

                        <td th:text="${contacto.apellidos}"></td>

                        <td th:text="${contacto.telefono}"></td>

                        <td th:text="${contacto.email}"></td>

                        <td>

                            <a th:href="@{/contactos/{id}/editar(id=${contacto.id})}"
                               class="btn btn-sm btn-warning">
                                Editar
                            </a>

                            <form th:action="@{/contactos/{id}/eliminar(id=${contacto.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-danger"
                                        onclick="return confirm('¿Seguro que quieres eliminar este contacto?')">
                                    Eliminar
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(contactos)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            No tienes contactos todavía.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="mt-3">

        <form th:action="@{/logout}" method="post">

            <button type="submit" class="btn btn-secondary">
                Cerrar sesión
            </button>

        </form>

    </div>

</div>

</body>

</html>
